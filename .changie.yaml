changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: |
  ## v{{.Version}}

  Date: {{.Time.Format "2006-01-02"}}
kindFormat: "### {{.Kind}}"
changeFormat: "- {{.Body}}"
kinds:
  - label: Breaking
    auto: major
  - label: What's Changed
    auto: minor
  - label: Minor Changes
    auto: minor
  - label: Patch Changes
    auto: patch
newlines:
  afterChangelogHeader: 1
  beforeChangelogVersion: 1
  endOfVersion: 1
envPrefix: CHANGIE_
