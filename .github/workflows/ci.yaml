name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: go test
        run: go test ./...

  changeset-check:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request'
      && !contains(github.actor, 'dependabot')
      && !contains(github.actor, 'renovate')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: install changie
        run: go install github.com/miniscruff/changie@latest

      - name: check changesets
        run: changie check
